<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tournament | TypeForge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  
  <style>
    body {
      background: #0e0e0e;
      color: #f1f1f1;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #141414;
      padding: 12px 25px;
      border-bottom: 1px solid #222;
    }
    header h1 {
      color: #00ffcc;
      font-weight: 700;
      font-size: 1.3rem;
      margin: 0;
    }
    nav a {
      color: #ccc;
      margin-left: 16px;
      text-decoration: none;
      font-size: 0.95rem;
      transition: 0.2s;
    }
    nav a:hover { color: #00ffcc; }

    .container {
      max-width: 900px;
      margin: 50px auto;
      text-align: center;
      padding: 20px;
    }

    .tournament-info {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 0 10px rgba(0,255,204,0.15);
    }

    .tournament-status {
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .bracket {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .player-card {
      background: #222;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      border: 2px solid #333;
    }

    .player-card.winner {
      border-color: #00ffcc;
      background: linear-gradient(135deg, #1a3a2e, #222);
    }

    .player-card.current {
      border-color: #ffba40;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 186, 64, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(255, 186, 64, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 186, 64, 0); }
    }

    #countdown {
      font-size: 80px;
      color: #ffba40;
      font-weight: 900;
      margin: 40px 0;
      animation: pop 1s ease-in-out;
    }

    @keyframes pop {
      0% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0; transform: scale(0.8); }
    }

    #sentence {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 25px;
      color: #ddd;
      font-size: 1.2rem;
      margin: 20px 0;
      box-shadow: 0 0 10px rgba(0,255,204,0.15);
    }

    #input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      outline: none;
      margin-bottom: 20px;
      background: #222;
      color: #f1f1f1;
      transition: 0.3s;
    }

    #input:disabled {
      background: #111;
      color: #555;
      cursor: not-allowed;
    }

    .tournament-controls {
      margin: 20px 0;
    }

    .btn {
      background: #00ffcc;
      color: #111;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      margin: 5px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #00ccaa;
    }

    .btn:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #leaderboard {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 20px;
      margin-top: 30px;
      text-align: left;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #333;
    }

    .leaderboard-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
<header>
 <h1>TypeForge<span style="color:#fff; font-size:1rem;">.io</span></h1>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('leaderboard') }}">Leaderboard</a>
    <a href="{{ url_for('history_view') }}">History</a>
    <a href="{{ url_for('multiplayer', level='beginner') }}">Multiplayer</a>
    {% if current_user.role == 'admin' %}
      <a href="{{ url_for('admin_dashboard') }}">Admin</a>
    {% endif %}
    <a href="{{ url_for('logout') }}">Logout</a>
  </nav>
</header>

<div class="container">
  <h1>🏆 Tournament - {{ level.title() }}</h1>
  
  <div class="tournament-info">
    <div class="tournament-status" id="tournament-status">Waiting for players...</div>
    <div id="round-info">Round: 1/3</div>
  </div>

  <div class="bracket" id="bracket">
    <!-- Tournament bracket will be populated by JavaScript -->
  </div>

  <div id="game-area" style="display: none;">
    <div id="countdown">3</div>
    <div id="sentence">Loading...</div>
    <input type="text" id="input" disabled placeholder="Type here when countdown finishes...">
    
    <div class="tournament-controls">
      <button class="btn" id="ready-btn">Ready</button>
      <button class="btn" id="leave-btn">Leave Tournament</button>
    </div>
  </div>

  <div id="leaderboard">
    <h3>Tournament Leaderboard</h3>
    <div id="leaderboard-list">
      <!-- Leaderboard will be populated by JavaScript -->
    </div>
  </div>
</div>

<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
<script>
  const socket = io();
  const level = '{{ level }}';
  const username = '{{ user.username }}';
  let currentSentence = '';
  let tournamentData = null;
  let isReady = false;

  socket.on('connect', function() {
    console.log('Connected to tournament');
    socket.emit('join_tournament', { level: level, username: username });
  });

  socket.on('tournament_update', function(data) {
    tournamentData = data;
    updateTournamentDisplay(data);
  });

  socket.on('round_start', function(data) {
    currentSentence = data.sentence;
    document.getElementById('sentence').textContent = currentSentence;
    document.getElementById('game-area').style.display = 'block';
    startCountdown();
  });

  socket.on('tournament_message', function(message) {
    document.getElementById('tournament-status').textContent = message;
  });

  function updateTournamentDisplay(data) {
    const bracket = document.getElementById('bracket');
    bracket.innerHTML = '';

    if (data.players && data.players.length > 0) {
      data.players.forEach(player => {
        const card = document.createElement('div');
        card.className = 'player-card';
        if (player.status === 'winner') card.classList.add('winner');
        if (player.username === username) card.classList.add('current');
        
        card.innerHTML = `
          <div><strong>${player.username}</strong></div>
          <div>WPM: ${player.wpm || 0}</div>
          <div>Status: ${player.status || 'waiting'}</div>
        `;
        bracket.appendChild(card);
      });
    }

    document.getElementById('round-info').textContent = `Round: ${data.current_round || 1}/${data.total_rounds || 3}`;
  }

  function startCountdown() {
    let count = 3;
    const countdownEl = document.getElementById('countdown');
    
    const interval = setInterval(() => {
      countdownEl.textContent = count;
      count--;
      
      if (count < 0) {
        clearInterval(interval);
        countdownEl.style.display = 'none';
        document.getElementById('input').disabled = false;
        document.getElementById('input').focus();
        startTyping();
      }
    }, 1000);
  }

  function startTyping() {
    const input = document.getElementById('input');
    const startTime = Date.now();
    
    input.addEventListener('input', function() {
      const typed = input.value;
      const progress = (typed.length / currentSentence.length) * 100;
      
      socket.emit('tournament_progress', {
        progress: progress,
        typed: typed,
        time: Date.now() - startTime
      });
      
      if (typed === currentSentence) {
        const wpm = calculateWPM(currentSentence, Date.now() - startTime);
        socket.emit('tournament_finish', { wpm: wpm });
        input.disabled = true;
      }
    });
  }

  function calculateWPM(text, timeMs) {
    const words = text.trim().split(/\s+/).length;
    const minutes = timeMs / 60000;
    return Math.round(words / minutes);
  }

  document.getElementById('ready-btn').addEventListener('click', function() {
    isReady = !isReady;
    this.textContent = isReady ? 'Not Ready' : 'Ready';
    socket.emit('tournament_ready', { ready: isReady });
  });

  document.getElementById('leave-btn').addEventListener('click', function() {
    socket.emit('leave_tournament');
    window.location.href = '{{ url_for("index") }}';
  });
</script>

<span id="user-plan" style="display:none;">{{ user.plan }}</span>
</body>
</html>
